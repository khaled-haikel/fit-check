role_title: Remote AI Automation Engineer (LLM Systems and Automation)
job_description: |
  Remote AI Automation Engineer (LLM Systems and Automation)
  100% remote from Latin America. Full-time, as an independent contractor for a US company. Preferred residency in Mexico; candidates across Latin America are considered.

  About the client
  A recruiting agency is hiring for a lean US digital media and technology company that combines low-code automation, custom development and LLM capabilities to improve business performance.

  What you will do
  - Build, test, troubleshoot and maintain scalable n8n workflows, integrating REST and GraphQL APIs, webhooks, databases and third-party platforms.
  - Write JavaScript/TypeScript or Python when custom logic or data processing is needed.
  - Integrate LLM capabilities into business operations, reporting and research tools.
  - Structure data from documents and conversations, keeping source references and client access boundaries.
  - Decide what instructions, information and tools each model needs at each step; choose models per task and use lower-cost models where tests show they meet the quality bar.
  - Measure accuracy, errors, token usage, cost and completion time, and build repeatable tests on real tasks before deploying improvements.

  Required qualifications
  - Hands-on experience building, debugging and deploying real-world automation workflows in n8n.
  - Understanding of context engineering and of the differences between models.
  - Full ownership of the AI systems you build, including how the internal team uses them.
  - Practical JavaScript/TypeScript and/or Python skills for backend logic and data parsing.
  - Proven experience with webhooks, RESTful APIs, database connections and third-party software.
  - Hands-on experience embedding LLM endpoints and prompt architectures into workflows.
  - Ability to critically audit and validate AI-generated code instead of trusting it unverified.
  - Pragmatic problem solving, favoring maintainable solutions over over-engineering.
  - Advanced written and spoken English to work with founders and technical teams.
  - A dedicated quiet workspace, a high-performance computer, backups and high-speed internet.

  Preferred qualifications
  - Residency in Mexico.
  - A portfolio of completed AI workflows, custom scripts or automated operations tools.

  Compensation: up to USD 3,000 per month.
