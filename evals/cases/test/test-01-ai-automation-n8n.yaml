role_title: AI Automation Engineer, n8n Expert (Remote, LATAM)
job_description: |
  AI Automation Engineer, n8n Expert (Remote, LATAM)
  Fully remote, open to Latin America (the listing is based in Colombia). Full-time.

  About the company
  A fast-growing US beverage brand founded in California in 2014 and sold nationwide.

  What you will do
  - Design, build and maintain advanced n8n workflows with strong organization, documentation and scalability.
  - Build and troubleshoot Monday.com automations, cross-board logic, notifications and integrations.
  - Work with APIs, webhooks, JSON, conditional logic, error handling, monitoring and retries.
  - Build AI-powered workflows with OpenAI and other LLMs and OCR, including document and image processing and structured data extraction.
  - Engineer prompts for consistent outputs and connect AI results to business processes.
  - Build BI dashboards and reports in tools such as Power BI, Looker Studio, Tableau, Metabase or Monday.com.
  - Create lightweight data pipelines between Monday.com, Google Sheets, n8n and other systems, and monitor data quality.

  Requirements
  - Advanced or expert-level n8n experience.
  - Proven experience building complex, production-ready automation workflows.
  - Strong grasp of clean, scalable workflow architecture.
  - Experience with OpenAI and other LLMs, APIs, webhooks, JSON and third-party integrations.
  - Experience with Monday.com.
  - Experience with BI and reporting tools.
  - Strong troubleshooting, documentation and analytical skills.
  - Advanced English.

  Nice to have
  - JavaScript or Python.
  - Make or Zapier.

  Benefits: learning budget, paid time off and fully remote work.
