name: Analysis evaluation (test split)

# Measures the analysis on the test split, in the three modes, once at the end
# of a stage: run by hand on main. Its numbers are recorded in evals/results/
# and never used to change a prompt, a parameter or the pairing threshold
# (docs/adr/0007-analysis-evaluation.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-analysis-test
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"

jobs:
  eval-analysis-test:
    # The eval role trusts only pull requests and the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the API with its test dependencies
        run: python -m pip install -e "./api[test]"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/llm-cache
          key: llm-cache-test-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: llm-cache-test-

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          role-session-name: fitcheck-eval-analysis-test-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Build the search index
        run: python scripts/build_index.py --output build/index.json

      # Cost cap: 3 USD.
      - name: Evaluate the analysis on the test split
        run: >-
          python evals/analysis.py
          --index build/index.json
          --suite test
          --output build/analysis-test.json
          --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: build/llm-cache
          key: llm-cache-test-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: analysis-test
          path: build/analysis-test.json
          if-no-files-found: warn
          retention-days: 90
