name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: 1.16.5
  TF_VAR_env: prod

jobs:
  # Which parts of the repository the pull request touches. Jobs that only
  # matter for some paths gate on these outputs; a new path-gated job adds its
  # own output here and gates on it the same way.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      content: ${{ steps.paths.outputs.content }}
      retrieval: ${{ steps.paths.outputs.retrieval }}
      analysis: ${{ steps.paths.outputs.analysis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          printf '%s\n' "$changed"
          matches() { grep -qE "$1" <<<"$changed" && echo true || echo false; }
          {
            echo "app=$(matches '^(api/|infra/app/|scripts/|config/|\.github/workflows/)')"
            # The cards and cases, their schemas and the validation script.
            echo "content=$(matches '^(evidence/|evals/|api/src/fitcheck_api/(evidence|cases|content)\.py|scripts/validate_content\.py|\.github/workflows/pull-request\.yml)')"
            # Anything that can move the retrieval numbers: the cards, the cases,
            # the embedding model, the index build and the search code.
            echo "retrieval=$(matches '^(evidence/|evals/|config/|scripts/build_index\.py|api/src/fitcheck_api/(evidence|cases|content|embeddings|search|metrics)\.py|\.github/workflows/pull-request\.yml)')"
            # Anything that can move the analysis numbers: the prompts and their
            # configuration, the evaluation and its baseline, the golden set,
            # the cards and the index, the analysis, search and content code.
            # The handler, the worker and the infrastructure do not.
            echo "analysis=$(matches '^(prompts/|config/(analysis|models|retrieval)\.json|evals/(config\.json|analysis\.py|baseline/analysis\.json|cases/)|evidence/|scripts/build_index\.py|api/src/fitcheck_api/(analysis/|search\.py|embeddings\.py|evidence\.py|cases\.py|content\.py)|\.github/workflows/pull-request\.yml)')"
          } >> "$GITHUB_OUTPUT"

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # terraform test checks the rendered IAM documents and key settings
      # offline, without AWS credentials.
      - name: Validate and test infra/bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

      - name: Validate and test infra/app
        working-directory: infra/app
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test

  pytest:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the API with its test dependencies
        run: python -m pip install -e "./api[test]"

      - name: pytest
        run: python -m pytest api

  # Schemas and cross-references of evidence/ and evals/, without AWS.
  validate-content:
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the API with its test dependencies
        run: python -m pip install -e "./api[test]"

      - name: Validate the cards and the cases
        run: python scripts/validate_content.py

  # Builds the index with Titan and scores every configuration of the
  # retrieval ablation on the golden set (evals/retrieval.py). Calls only the
  # embedding model, a few hundred times per run, one call at a time.
  eval-retrieval:
    needs: changes
    # Workflows from forks get no OIDC token, so only branches of this
    # repository can assume the eval role.
    if: needs.changes.outputs.retrieval == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the API with its test dependencies
        run: python -m pip install -e "./api[test]"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          role-session-name: fitcheck-eval-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Build the search index
        run: python scripts/build_index.py --output build/index.json

      # The gate compares hit@5 and recall@5 per split with
      # evals/baseline/retrieval.json; without a baseline the run only reports.
      # retrieval-baseline.json holds these numbers in baseline form, ready to
      # commit once reviewed. Choose configurations on dev only (--splits dev
      # keeps test unseen); test is for the final table.
      - name: Evaluate retrieval
        run: >-
          python evals/retrieval.py
          --index build/index.json
          --splits dev,test
          --output build/retrieval.json
          --write-baseline build/retrieval-baseline.json
          --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: retrieval-eval
          path: |
            build/index.json
            build/retrieval.json
            build/retrieval-baseline.json
          if-no-files-found: warn
          retention-days: 30

  # The analysis evaluation (evals/analysis.py): dev in extraction and in
  # judgment, the specials end to end, gated against
  # evals/baseline/analysis.json. Without a baseline it calibrates (dev three
  # times) and only reports. Claude and Titan responses are cached across the
  # runs of a pull request, so a rerun pays only for what changed. It waits for
  # eval-retrieval so the two jobs do not share the account's Titan quota.
  eval-analysis:
    needs: [changes, eval-retrieval]
    if: ${{ !cancelled() && needs.changes.outputs.analysis == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the API with its test dependencies
        run: python -m pip install -e "./api[test]"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/llm-cache
          key: llm-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: llm-cache-

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          role-session-name: fitcheck-eval-analysis-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Build the search index
        run: python scripts/build_index.py --output build/index.json

      # Cost caps per run: 3 USD gated, 4 USD calibrating. The run stops, and
      # says where, before a call that could pass the cap.
      - name: Evaluate the analysis
        run: >-
          python evals/analysis.py
          --index build/index.json
          --suite pr
          --output build/analysis.json
          --write-baseline build/analysis-baseline.json
          --summary "$GITHUB_STEP_SUMMARY"

      # Saved even when the run fails or is cancelled, to keep what was paid for.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: build/llm-cache
          key: llm-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: analysis-eval
          path: |
            build/analysis.json
            build/analysis-baseline.json
          if-no-files-found: warn
          retention-days: 30

  plan:
    needs: [changes, validate]
    # Workflows from forks get no OIDC token, so only branches of this
    # repository can assume the plan role.
    if: needs.changes.outputs.app == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_commit_sha: ${{ github.event.pull_request.head.sha }}
      TF_VAR_allowed_origin: ${{ vars.ALLOWED_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # terraform plan hashes the package, so it must exist. The plan role has
      # no Bedrock access, so the package carries a placeholder index; the
      # deploy builds the real one.
      - name: Build the Lambda package
        run: |
          python scripts/build_lambda.py --placeholder-index
          echo "TF_VAR_embedding_model_id=$(jq -r .embedding.model_id config/models.json)" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: fitcheck-plan-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: terraform init
        working-directory: infra/app
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=app/$TF_VAR_env/terraform.tfstate"

      # The plan role is read-only, so the plan cannot take the state lock.
      # See docs/adr/0002-s3-state-native-lock.md.
      - name: terraform plan
        working-directory: infra/app
        run: terraform plan -input=false -lock=false
