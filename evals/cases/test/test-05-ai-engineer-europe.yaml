collected: '2026-10-14'
role_title: AI Engineer
job_description: |
  AI Engineer
  Europe (remote). Remote-first, or hybrid depending on the role.

  About the company
  A platform for global hiring, payroll, benefits, taxes and compliance, building the infrastructure for borderless teams.

  What you will do
  - Develop and deploy LLM-based solutions and RAG architectures.
  - Contribute to the full AI feature lifecycle, from problem framing to monitoring.
  - Work with data pipelines for preprocessing, feature extraction and model inference.
  - Integrate AI solutions into cloud infrastructure with attention to scalability, security and performance.
  - Collaborate with cross-functional squads and use AI coding tools as a standard part of development.

  Requirements
  - At least 3 years in software development.
  - At least 1 year in AI or ML engineering.
  - Production experience with LLM or RAG solutions.
  - Strong Python skills, including async patterns and FastAPI.
  - Hands-on use of AI coding tools in production engineering.
  - Understanding of cloud-based AI integration, preferably on AWS.
  - Database management and data wrangling.
  - Distributed systems experience.
  - A solid grounding in algorithms, statistics and data science.
  - Clear written communication and reliable asynchronous collaboration.

  Preferred
  - MLOps practices and tools.
  - Vector databases and semantic search (Pinecone, Weaviate, Elasticsearch).
  - AI or ML frameworks such as PyTorch, TensorFlow or LangChain.
  - Experience with SaaS or custom-built products.
  - Self-directed, proactively seeks feedback and growth.

  Competitive salary in EUR; asynchronous work environment.
