role_title: Applied AI Engineer
job_description: |
  Applied AI Engineer
  Fully remote.

  About the company
  A clinical AI company that delivers ongoing, proactive care for older adults with chronic conditions. It works as a full clinical care organization alongside health system partners, and its clinicians keep control of clinical decisions.

  What you will do
  - Build and deploy clinical AI agents that reason over patient data, use tools and generate care recommendations.
  - Own the reliability, observability and cost of LLM-powered workflows at scale.
  - Build retrieval pipelines over clinical knowledge bases, treatment protocols and live patient data.
  - Create evaluation frameworks, including benchmarks, safety tests and LLM-as-judge pipelines in CI/CD.
  - Design multi-step agent orchestration with memory, error recovery and human escalation paths.
  - Turn patient care needs into system designs with clinical, product and engineering teams.

  Requirements
  - Bachelor's or master's degree in a related field, or equivalent work experience.
  - 3+ years of software engineering.
  - 2+ years building AI or ML systems in production.
  - Experience in fast-paced environments with end-to-end ownership.
  - Hands-on experience with LLM APIs, prompt engineering, tool use and structured outputs.
  - Experience building RAG systems, including embeddings, vector stores and grounding.

  Nice to have
  - Experience with agent frameworks or orchestration patterns.
  - Fine-tuning experience (SFT, RLHF, LoRA) on domain-specific tasks.
  - Healthcare or regulated-industry experience, such as HIPAA, SOC 2 or clinical data handling.

  Compensation: USD 135,000 to 165,000 base plus equity.
