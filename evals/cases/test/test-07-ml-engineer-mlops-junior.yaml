role_title: ML Engineer I, MLOps Framework
job_description: |
  ML Engineer I, MLOps Framework
  Remote, United States. US work authorization required.

  About the company
  An autonomous trucking company, part of a large truck manufacturer's group, that develops software for automated trucks.

  The team
  The ML Ops Framework and Conversion team keeps the model development ecosystem running and gets models from development into real-world use reliably and at scale.

  What you will do
  - Provide on-call MLOps support to model development teams, triaging and resolving pipeline issues.
  - Debug model development workflows and find root causes across the ML stack.
  - Improve tooling, documentation and operational processes with senior engineers.
  - Communicate across teams so issues are resolved quickly and findings are shared.

  Requirements
  - Bachelor's degree in Computer Science, Robotics, Electrical Engineering or a related field.
  - Skills typically gained through 0 to 3+ years of experience.
  - Proficiency in Python.
  - Foundational experience with ML frameworks such as PyTorch and familiarity with model training pipelines.
  - Experience with MLOps tooling, including CI/CD, monitoring, logging and pipeline orchestration.
  - Strong debugging and problem-solving skills, including triaging issues under pressure.
  - Clear communicator who can translate technical issues for different audiences.

  Nice to have
  - Large sensor data formats (MCAP, Parquet) and processing tools (PyArrow, Daft, Pandas).
  - Distributed compute and orchestration frameworks (Ray, Anyscale).
  - Infrastructure-as-code experience (Terraform).
  - Edge deployment or embedded hardware.
  - Exposure to autonomous driving or robotics ML workflows.

  Compensation: USD 132,400 to 158,900 base, plus bonus and stock options.
