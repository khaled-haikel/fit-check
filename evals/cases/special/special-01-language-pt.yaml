role_title: Engenheiro(a) de Automação com IA (Sistemas com LLM e Automação)
job_description: |
  Engenheiro(a) de Automação com IA (Sistemas com LLM e Automação), remoto
  100% remoto a partir da América Latina. Tempo integral, como prestador independente para uma empresa dos Estados Unidos. Preferência por residência no México; candidatos de toda a América Latina são considerados.

  Sobre o cliente
  Uma agência de recrutamento contrata para uma empresa enxuta de mídia digital e tecnologia dos Estados Unidos, que combina automação low-code, desenvolvimento sob medida e LLMs para melhorar o desempenho do negócio.

  O que você vai fazer
  - Construir, testar, depurar e manter workflows escaláveis no n8n, integrando APIs REST e GraphQL, webhooks, bancos de dados e plataformas de terceiros.
  - Escrever JavaScript/TypeScript ou Python quando a lógica ou o tratamento de dados pedir código.
  - Integrar LLMs a operações, relatórios e ferramentas de pesquisa.
  - Estruturar dados de documentos e conversas, preservando as referências de origem e os limites de acesso de cada cliente.
  - Decidir de quais instruções, informações e ferramentas cada modelo precisa em cada etapa; escolher o modelo por tarefa e usar modelos mais baratos quando os testes mostrarem que eles atingem a qualidade exigida.
  - Medir acurácia, erros, uso de tokens, custo e tempo de conclusão, e montar testes repetíveis com tarefas reais antes de colocar melhorias no ar.

  Requisitos
  - Experiência prática construindo, depurando e colocando em produção workflows de automação reais no n8n.
  - Entendimento de engenharia de contexto e das diferenças entre modelos.
  - Responsabilidade total pelos sistemas de IA que você constrói, inclusive pela forma como o time interno os usa.
  - Habilidade prática em JavaScript/TypeScript e/ou Python para lógica de backend e tratamento de dados.
  - Experiência comprovada com webhooks, APIs REST, conexões com bancos de dados e softwares de terceiros.
  - Experiência prática integrando endpoints de LLM e arquiteturas de prompt a workflows.
  - Capacidade de auditar e validar criticamente código gerado por IA, em vez de confiar nele sem verificar.
  - Resolução de problemas pragmática, preferindo soluções fáceis de manter a excesso de engenharia.
  - Inglês avançado, escrito e falado, para trabalhar com fundadores e times técnicos.
  - Espaço de trabalho silencioso, computador de alto desempenho, backups e internet rápida.

  Diferenciais
  - Residência no México.
  - Portfólio de workflows de IA concluídos, scripts próprios ou ferramentas de automação de operações.

  Remuneração: até 3.000 dólares por mês.
