role_title: Member of Technical Staff, AI
job_description: |
  Member of Technical Staff, AI
  Hybrid, New York City office (the company also has offices in Bogotá and Mexico City).

  About the company
  A performance branding company that combines creative, media, SEO, lifecycle, retail media, affiliate and influencer marketing for consumer brands, and expects every employee to use AI daily.

  The role
  A full-lifecycle product role focused on LLM-powered applications, agent systems, and the evaluation and reliability systems needed to run them. You define problems, build small versions, test them with users, decide whether to continue, pivot or stop, scale what works and maintain it after launch, working closely with business partners.

  Required qualifications
  - Strong Python skills and experience with production systems.
  - Experience building production apps with LLM APIs (OpenAI, Anthropic or Vertex AI).
  - Experience with agent workflows, tool calling and multi-step tasks.
  - Experience designing LLM evaluations and debugging across models, code and external systems.
  - Understanding of context management, structured outputs and prompt design.
  - Experience with external APIs and SQL.
  - Experience with GCP, AWS or Azure.
  - Ability to build across frontend, backend and data.
  - Ability to explain trade-offs to business teams.
  - Ownership of products end to end.
  - Uses AI tools in daily development.

  Nice to have
  - Multi-agent architectures.
  - Embeddings, vector search and RAG.
  - Sandboxed code execution.
  - Human review and approval workflows.
  - Observability, model routing and cost control.
  - Document automation.
  - Internal developer tools.
  - Data warehouses, dbt and semantic layers.
  - TypeScript, React and backend services experience.

  Compensation: USD 90,900 to 254,100 total, across five levels.
