role_title: Senior AI Engineer, LLM and RAG
job_description: |
  Senior AI Engineer, LLM and RAG
  Palo Alto, California. Candidates must live in the Bay Area or relocate.

  About the company
  A high-growth "physical AI" company that processes visual, spatial and temporal data for intelligent automation in industrial settings.

  The role
  Lead the development of retrieval-augmented generation systems that help technicians troubleshoot industrial equipment, turning manuals, notes and sensor data into conversational guidance.

  What you will do
  - Architect and build RAG systems over structured and unstructured data.
  - Develop AI assistants that diagnose industrial anomalies and failures.
  - Build pipelines to ingest, preprocess and index document corpora for semantic search.
  - Fine-tune foundation models for industrial troubleshooting language.
  - Design evaluation methods for accuracy and user experience in production.

  Education
  M.S. or Ph.D. in computer science, AI, ML or a related field, ideally focused on NLP or deep learning.

  Required qualifications
  - 5+ years in ML or AI, focused on NLP, LLMs or conversational AI.
  - Hands-on experience with open-source and commercial LLMs.
  - Experience building RAG pipelines with LangChain, LlamaIndex or custom vector database integrations, including at least one production system.
  - Prompt engineering, instruction tuning or fine-tuning experience.
  - Strong grasp of semantic search, embeddings, similarity metrics and vector stores.
  - Core ML foundations, including reinforcement learning or decision-making models.
  - Proficiency with PyTorch, Hugging Face Transformers or similar.
  - Strong Python.
  - Experience deploying AI in user-facing products under operational constraints.
  - Strong problem-solving, communication and cross-functional collaboration skills.

  Bonus
  - LLM experience in industrial settings such as manufacturing, logistics, utilities or energy.
  - Knowledge of industrial control systems, maintenance workflows or technician support.
  - Multimodal models, or combining text with sensor or time-series data.
  - Startup experience building LLM products from scratch.
