role_title: Senior Software Engineer, AI Engineering
job_description: |
  Senior Software Engineer, AI Engineering
  San Francisco, New York, Portland, or remote within the United States or Canada.

  About the company
  A fintech company making a company-wide bet on AI. This team turns scattered internal AI experiments into shared infrastructure, context and capability.

  What you will do
  - Extend the AI platform: build and evolve MCP servers that connect internal systems to agents and engineers, operate the LLM gateway (routing, rate limiting, cost attribution, observability), and create shared prompt libraries, guardrails and policy-as-code.
  - Strengthen the shared knowledge layer: keep structured, agent-readable context artifacts and improve knowledge discoverability and retrieval.
  - Enable faster prototyping: sandbox environments, self-service scaffolding for non-engineers, and evaluation harnesses for testing agents before production.

  Qualifications
  - 5+ years of backend development experience on complex production systems.
  - Fluency across languages and comfort with platform engineering, infrastructure and developer tooling.
  - Hands-on experience building LLM-powered systems (RAG, agents, eval frameworks), with at least one shipped to production.
  - Understanding of AI deployment trade-offs: cost modeling, observability, latency and safety.
  - High agency and self-direction; able to work without a tightly defined scope.
  - Clear communication across technical and non-technical audiences.

  Compensation: USD 166,600 to 218,700 base (US).
