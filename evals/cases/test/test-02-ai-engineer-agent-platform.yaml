role_title: AI Engineer
job_description: |
  AI Engineer
  Remote within the United States (the company lists offices and hubs in several US cities). Periodic travel may be required.

  About the company
  A loyalty solutions company that runs large loyalty programs. The team is building an internal agent platform on Amazon Bedrock AgentCore that automates analyst workflows, surfaces insights from Snowflake program data and lets teams work with complex loyalty logic through LLMs. Hands-on, production-focused, not research.

  What you will do
  - Build agent harnesses in Python with LangChain and LangGraph: tool calling, structured outputs (Pydantic, JSON schema), retries, streaming and memory, packaged for the AgentCore Runtime.
  - Write API integrations, Snowflake SQL queries and Snowflake-backed retrieval with clear contracts and Pydantic validation.
  - Build evaluation harnesses (golden datasets, LLM-as-judge, regression suites) and wire them into CI.
  - Implement guardrails: auth scoping, input and output validation, PII and prompt-injection protection, and hallucination mitigation around tool execution.
  - Prototype, deploy, monitor traces and fix issues in production.

  Required
  - 3+ years of professional Python, including production services.
  - 1+ years of hands-on LLM work in production: prompt and context engineering, tool or function calling, structured outputs and RAG.
  - Working knowledge of LangChain/LangGraph or a comparable framework.
  - Experience with LLM observability tools (CloudWatch, LangSmith, Langfuse, MLflow or OpenTelemetry).
  - Experience designing evaluation frameworks (MLflow, DeepEval, LLM-as-judge, multi-turn regression).
  - Fluency with Git, Docker and modern API frameworks.
  - Clear written communication and sound judgment about when work is ready to ship.

  Strongly preferred
  - Hands-on experience with Amazon Bedrock or AgentCore.
  - Experience with Snowflake, Snowpark or Snowflake Cortex.
  - Strong SQL and an understanding of semantic models.
  - Familiarity with multi-agent patterns: supervisor or router, subagent handoff, reflection and human-in-the-loop.
  - A considered view on where agents should and should not act.
  - Experience in loyalty, MarTech, AdTech or a comparable data-rich B2B domain.

  A bachelor's degree is not required; equivalent practical experience counts.
