collected: '2026-10-14'
role_title: AI Engineer
job_description: |
  AI Engineer
  Remote, United States. Full-time. All work must be performed from the contiguous United States.

  About the company
  A technology consultancy with more than 20 years of experience helping government agencies and businesses modernize legacy systems and build cloud-native applications.

  The role
  Help federal and commercial clients ship production-grade LLM applications, focused on agentic systems and MCP-based integrations. Applied role, not research: you will not train foundation models.

  What you will do
  - Design multi-step agents that plan, call tools, retrieve context and take actions, with human-in-the-loop checkpoints.
  - Build MCP servers and clients that expose client data, internal tools and APIs to LLMs securely and auditably.
  - Ship copilots, document intelligence, search, summarization and workflow automation.
  - Design RAG pipelines: chunking, embeddings, vector stores, retrieval, reranking and grounding.
  - Integrate model APIs (OpenAI, Anthropic, Bedrock, Azure OpenAI, open-weight models) and choose models by quality, latency and cost.
  - Develop evals and observability for agents and AI features.

  Basic qualifications
  - 5+ years of professional software engineering experience.
  - At least 1 year shipping LLM-based or AI-powered features to production.
  - Hands-on experience building agentic systems: tool calling, multi-step reasoning, planning loops or orchestration (LangGraph, CrewAI, OpenAI Agents SDK, Claude tool use or equivalent).
  - Working knowledge of the Model Context Protocol (MCP), or the ability to learn it quickly.
  - Strong Python and experience building and deploying backend services and APIs (FastAPI, Flask).
  - Hands-on experience with at least one major LLM provider.
  - Working knowledge of RAG: embeddings, vector databases (pgvector, Pinecone, Weaviate, Qdrant) and retrieval evaluation.
  - Proficiency in prompt engineering, structured outputs (JSON mode, schemas) and tool or function calling.
  - Experience writing evals, even lightweight ones, for non-deterministic systems.
  - Solid SQL and experience with relational and unstructured data.
  - Familiarity with at least one cloud platform (AWS, Azure or GCP).
  - Experience with Git, code review and modern collaborative workflows.
  - Strong written and verbal communication, including explaining AI trade-offs to non-technical stakeholders.
  - US citizen or legal resident, working from the contiguous United States.

  Nice to have
  - Authoring MCP servers for complex systems such as databases, internal APIs or document stores.
  - Eval or observability platforms (Braintrust, LangSmith, Langfuse, Arize) or custom harnesses.
  - Multi-agent orchestration and reasoning about agent failure modes.
  - Fine-tuning, distillation or LoRA with measurable impact.
  - Docker, Kubernetes and CI/CD for AI workloads.
  - TypeScript/Node for full-stack AI features.
  - Streaming UIs (SSE, WebSockets) and token-level UX patterns.
  - Caching, prompt compression and cost and latency optimization at scale.
  - Background supporting federal or government clients.
  - Awareness of NIST AI RMF, FedRAMP or similar responsible-AI frameworks.

  Compensation: USD 130,000 to 200,000 per year.
