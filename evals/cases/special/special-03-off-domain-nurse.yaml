role_title: Registered Nurse, Intensive Care Unit (Night Shift)
job_description: |
  Registered Nurse, Intensive Care Unit (Night Shift)
  On site at a 400-bed hospital in Columbus, Ohio. Full-time, three 12-hour night shifts per week.

  About the role
  Provide direct care to critically ill adult patients in a 24-bed medical and surgical ICU, working with physicians, respiratory therapists and pharmacists.

  What you will do
  - Assess, monitor and document patient condition in the electronic health record.
  - Administer medications, blood products and titrated drips according to protocol.
  - Manage ventilated patients, arterial lines and central lines.
  - Respond to rapid response and code blue events.
  - Educate patients and families about care plans and discharge.

  Requirements
  - Active Registered Nurse license in the state of Ohio or a compact state.
  - Bachelor of Science in Nursing (BSN).
  - 2+ years of adult ICU experience.
  - Current BLS and ACLS certifications.
  - Experience charting in Epic or a similar electronic health record.
  - Experience caring for ventilated patients and managing vasoactive drips.

  Nice to have
  - CCRN certification.
  - Experience as a charge nurse or preceptor.
