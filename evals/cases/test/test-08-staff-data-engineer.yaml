role_title: Staff Data Engineer
job_description: |
  Staff Data Engineer
  Remote, United States (remote-first company).

  About the company
  A health IT company with more than 400 employees and 30,000 customers that offers clinical communication and physician scheduling.

  The role
  A senior seat to build a unified data platform across the product portfolio: a data store, a shared taxonomy and pipelines. You will shape the detailed architecture, own ingestion and modeling, set data quality standards, partner on safe extraction from production databases and mentor data engineers.

  Requirements
  - Substantial experience building and operating cloud data platforms, ideally one designed from scratch.
  - Comfort making decisions with incomplete information, and judgment about which decisions are costly to get wrong.
  - Deep SQL.
  - Strong command of a cloud data warehouse (Snowflake, BigQuery, Databricks or similar).
  - Experience with a transformation framework such as dbt, with clear opinions on project structure.
  - ELT and change-data-capture experience across relational sources.
  - AWS experience, including read replicas, object storage and cross-region data movement.
  - Applied dimensional or medallion modeling.
  - Workflow orchestration (Airflow, Dagster, Prefect or similar).
  - Data quality testing as a habit.

  Nice to have
  - Healthcare data and handling of protected health information (PHI).
  - Multi-tenant data isolation.
  - Semantic or metrics layer design.
  - Modern BI and self-serve reporting tools.

  Compensation: USD 170,000 to 200,000 per year.
