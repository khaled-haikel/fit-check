role_title: Machine Learning Engineer
job_description: |
  Machine Learning Engineer
  Washington, DC (hybrid).

  About the role
  Deploy, maintain and monitor the AI and ML systems behind an AI platform, working with data scientists, data engineers and product teams. The focus is operationalizing large language models and other ML systems so they run efficiently, securely and with robust monitoring.

  What you will do
  - Design, implement and maintain ML deployment pipelines for scalable production systems.
  - Operationalize LLMs and other models for high availability and reliability.
  - Build model monitoring, logging and alerting to track performance and detect drift.
  - Move models from research or prototype into production with data scientists.
  - Develop CI/CD pipelines for ML workflows, including testing, validation and automated deployment.
  - Optimize model runtime performance across AWS, GCP, Azure and distributed systems.
  - Use Docker and Kubernetes for reproducible, scalable systems.

  Qualifications
  - 5+ years as a Machine Learning Engineer, MLOps Engineer or similar role.
  - Proven experience deploying and maintaining ML models in production at scale.
  - Hands-on experience with ML lifecycle tools such as MLflow, Kubeflow, SageMaker or Vertex AI.
  - Strong Python skills.
  - Familiarity with PyTorch or TensorFlow.
  - Deep knowledge of Docker for production ML systems.
  - Deep knowledge of Kubernetes for production ML systems.
  - Expertise with AWS, GCP or Azure for ML deployment and scaling.
  - Strong understanding of MLOps best practices, monitoring and automation.
  - Strong communication and collaboration across technical and non-technical teams.
