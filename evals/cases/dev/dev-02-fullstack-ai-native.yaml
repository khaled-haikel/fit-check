role_title: Senior Full-Stack Engineer (Node.js and Next.js, AI-native)
job_description: |
  Senior Full-Stack Engineer (Node.js and Next.js, AI-native), Remote
  Remote, open to candidates in approved locations: Mexico, Brazil, the rest of South America and Europe. Mid-level to senior individual contributor. Professional English and availability for US business hours are required.

  About the company
  An early-stage US telehealth startup focused on weight management and long-term metabolic health, building its e-commerce and clinical infrastructure from scratch. Remote-first and globally distributed.

  The role
  About 90% hands-on coding. You use LLMs and AI tools across design, coding, testing, debugging and shipping, and you orchestrate teams of Claude agents to parallelize work. Domains include an EMR and clinical data engine, an AI clinical copilot, e-prescribing, virtual care over WebRTC, and e-commerce checkout with subscription billing.

  What you will do
  - Use Cursor, Copilot and LLM APIs as core tools to generate and validate code.
  - Design and run Claude agent teams: decompose tasks, manage context handoffs and merge outputs into production-ready work.
  - Own full-stack features end to end, from schema design to production, across Node.js and Next.js.
  - Build LLM product features: prompt pipelines, RAG, structured output parsing and agentic workflows.
  - Keep production quality: API contracts, database migrations, CI/CD and observability; own the correctness of AI-generated code.
  - Ensure HIPAA and SOC 2 compliance, including encryption, audit logs and PII protection.

  Requirements
  - 3+ years of professional software engineering experience.
  - Concrete evidence of an AI-native workflow (portfolio or examples preferred).
  - Comfortable moving between backend and frontend without hand-holding.
  - High agency: makes high-leverage decisions independently in ambiguous settings.
  - Professional English for technical documentation and async collaboration.

  Technical skills
  - Backend: Node.js and TypeScript (async patterns, event-driven design, performance); REST, GraphQL and tRPC; PostgreSQL (joins, indexing, migrations); Redis caching.
  - Frontend: Next.js and React, including the App Router and React Server Components; state management with TanStack Query, Zustand or similar.
  - AI: production experience with the OpenAI or Anthropic APIs (streaming, tool use, structured outputs); building Claude agent teams with the Claude Agent SDK; daily use of Cursor, GitHub Copilot or an equivalent.
  - Cloud and DevOps: AWS (EC2, RDS, Lambda, S3), Vercel and GitHub Actions.
