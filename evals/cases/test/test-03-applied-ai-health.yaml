role_title: Applied AI Engineer
job_description: |
  Applied AI Engineer
  Remote, anywhere in the continental United States. No travel required. US work authorization is required.

  About the company
  A health company offering a personalized guidance system for lifelong health that combines AI, human expertise, personal health data and accountability.

  What you will do
  - Build and ship AI agents for real users: tool-calling LLM systems with structured output, parallel API orchestration and streaming responses.
  - Design evaluation harnesses and quality scoring with Langfuse and rubrics for safety, effectiveness and personalization.
  - Own the full cycle: prototype, validate with evals, deploy to staging and production, monitor traces and iterate.
  - Improve reliability, latency and cost through prompt caching, token budgets, retry logic and observability.
  - Write agent tools, including API integrations with Pydantic validation and search over local databases.

  Requirements
  - Strong Python skills and experience building and deploying services on large production systems.
  - Experience with LangChain/LangGraph or similar agent frameworks.
  - Hands-on production experience with LLMs: prompt engineering, tool or function calling and structured output.
  - Hands-on production experience evaluating LLM systems.
  - Comfort with async Python, HTTP APIs and streaming protocols (SSE, webhooks).
  - Experience with data validation and schema design (Pydantic, JSON Schema).
  - Ability to debug across layers, from a faulty LLM tool call to a misconfigured Terraform resource.
  - Clear communication with product, mobile and backend engineers.

  Nice to have
  - AWS familiarity (Bedrock, ECR, CloudFront, S3, Cognito) or other cloud agent hosting.
  - Observability tools (Langfuse, OpenTelemetry, Datadog).
  - Evaluation framework experience (LLM-as-a-judge, automated scoring, dataset management).
  - Infrastructure-as-code experience (Terraform, CDK).

  Compensation: USD 215,000 to 250,000 base plus equity.
