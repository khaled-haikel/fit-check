[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitcheck-api"
version = "0.1.0"
description = "fit-check HTTP API, served by AWS Lambda."
requires-python = ">=3.12"
# Runtime dependencies are bundled into the Lambda package by
# scripts/build_lambda.py; keep them pinned.
dependencies = [
  "aws-lambda-powertools==3.35.0",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
# Tests and the CI tooling (content validation, index build, retrieval eval).
# Not bundled: the Lambda runtime already ships boto3, and YAML is read only
# in CI.
test = [
  "boto3==1.43.113",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
