name: Pages

# Builds the public page (page/) and publishes it to GitHub Pages, at
# https://khaled-haikel.github.io/fit-check/. The page reads the test results
# from evals/results/ at build time, so a new result republishes it too.
on:
  push:
    branches: [main]
    paths:
      - "page/**"
      - "evals/results/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      script: ${{ steps.bundle.outputs.script }}
    defaults:
      run:
        working-directory: page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: page/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The API URL is public; the build also writes it into the page's
      # content security policy as the only allowed connection.
      - name: Lint, type check and build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build

      # The script's file name carries a content hash; the smoke test looks for
      # it to tell the new deployment from the one before.
      - name: Name the bundle
        id: bundle
        run: echo "script=$(basename dist/assets/index-*.js)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: page/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can deploy to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The page answers 200 with its title and this build's script, and the
      # script answers 200. Pages can take a minute to serve a new deployment,
      # so this retries.
      - name: Smoke test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SCRIPT: ${{ needs.build.outputs.script }}
        run: |
          for attempt in $(seq 1 20); do
            status="$(curl -s -o page.html -w '%{http_code}' "$PAGE_URL" || echo 000)"
            if [ "$status" = 200 ] && grep -q '<title>Fit Check' page.html && grep -q "assets/${SCRIPT}" page.html; then
              script_status="$(curl -s -o /dev/null -w '%{http_code}' "${PAGE_URL%/}/assets/${SCRIPT}" || echo 000)"
              if [ "$script_status" = 200 ]; then
                echo "${PAGE_URL} answers 200 with its title and assets/${SCRIPT}, which answers 200."
                exit 0
              fi
            fi
            echo "Attempt ${attempt}: page ${status}, waiting for assets/${SCRIPT}."
            sleep 15
          done
          echo "::error::${PAGE_URL} did not serve this build."
          exit 1
